<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">

<head>
  {%- include head.html -%}
  <style>
    /* Hero profile styling */
    .hero-profile {
      display: flex;
      align-items: center;
      gap: 30px;
      margin-bottom: 30px;
      padding-bottom: 25px;
      border-bottom: 1px solid #eaeaea;
    }

    .profile_picture {
      width: 120px;
      height: 120px;
      object-fit: cover;
      object-position: center 35%;
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      flex-shrink: 0;
    }

    @media (max-width: 600px) {
      .hero-profile {
        flex-direction: column;
        text-align: center;
      }
    }
  </style>
</head>

<body>

  {%- include header.html -%}

  <main class="page-content" aria-label="Content">
    <div class="wrapper">
      <!-- Page title header removed so it stays hidden -->
      <div class="post-content">
        {{ content }}
      </div>
    </div>
  </main>

  {%- include footer.html -%}

</body>
</html>
